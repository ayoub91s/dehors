name: Actualiser les événements
on:
  schedule:
    - cron: '20 5 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python update_events.py
      - name: Publier le catalogue
        run: |
          git config user.name 'dehors bot'
          git config user.email 'actions@users.noreply.github.com'
          git add events.json
          if ! git diff --cached --quiet; then
            git commit -m 'Actualisation des événements'
            git push
          fi
